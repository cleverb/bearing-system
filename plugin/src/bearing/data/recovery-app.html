<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #121212; --panel: #1c1c1c; --card: #222; --line: #333;
      --text: #f2f2f2; --muted: #9a9a9a; --dim: #6e6e6e;
      --blue: #3b82f6; --green: #34d399; --amber: #f59e0b; --purple: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 18px 20px 16px;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
    }
    h1 { font-size: 28px; margin: 0; letter-spacing: -0.03em; }
    .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
    header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .live { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 18px 0 14px; }
    .metric { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .metric .k { color: var(--muted); font-size: 12px; }
    .metric .v { font-size: 26px; font-weight: 650; margin: 4px 0 2px; letter-spacing: -0.03em; }
    .metric .h { color: var(--muted); font-size: 12px; }
    .bar { height: 4px; background: #2a2a2a; border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--blue); }
    .ok { color: var(--green); font-size: 12px; }
    .warn { color: var(--amber); }
    .pipeline {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 18px;
    }
    .pipeline h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 14px; }
    .steps { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; }
    .step { flex: 1; text-align: center; position: relative; color: var(--dim); font-size: 11px; }
    .step .n {
      width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 8px;
      border: 2px dashed #444; display: flex; align-items: center; justify-content: center; font-weight: 650;
      background: var(--bg); color: var(--dim);
    }
    .step.on .n { background: var(--blue); border: none; color: #fff; }
    .step.done .n { background: #1f3d32; border: 2px solid var(--green); color: var(--green); }
    .step.on { color: var(--text); font-weight: 600; }
    .cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; margin-top: 12px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-height: 220px; }
    .panel h2 { font-size: 14px; margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
    .cell {
      aspect-ratio: 1; border-radius: 8px; border: 1px dashed #3a3a3a; color: #555;
      display: flex; align-items: center; justify-content: center;
    }
    .cell.scanned { color: var(--green); border-style: solid; border-color: #245c48; background: #14241e; }
    .cell.scanning { color: var(--blue); border-style: solid; border-color: #1e4a8a; background: #152238; }
    .cell.skipped { color: var(--amber); border-color: #6b4a12; }
    .legend { display: flex; gap: 14px; margin-top: 12px; color: var(--muted); font-size: 12px; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .sw { width: 10px; height: 10px; border-radius: 3px; background: #3a3a3a; }
    .sw.scanned { background: var(--green); }
    .sw.scanning { background: var(--blue); }
    .sw.skipped { background: var(--amber); }
    .feed { list-style: none; margin: 0; padding: 0; font-size: 13px; }
    .feed li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #2a2a2a; color: #d4d4d4; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 650; }
    .badge.scan { background: #1e3a5f; color: #93c5fd; }
    .badge.found { background: #14532d; color: #86efac; }
    .badge.idx { background: #3b0764; color: #e9d5ff; }
    .badge.info { background: #27272a; color: #d4d4d8; }
    .time { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 64px; }
    .focus {
      margin-top: 12px; background: #181818; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center;
    }
    .focus .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .strategy { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .icon { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; }
    .icon-lg { width: 18px; height: 18px; }
    .icon-spin { animation: mcp-spin 0.85s linear infinite; transform-origin: center; }
    @keyframes mcp-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .constraint {
      display: none; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #7c5a12; background: #2a1f0a; color: #fbbf24; font-size: 13px;
    }
    .constraint.show { display: flex; gap: 8px; align-items: flex-start; }
    .done-banner { display: none; margin-top: 10px; color: var(--green); font-size: 13px; }
    .error { color: #f87171; font-size: 13px; }
    @media (max-width: 820px) {
      .metrics { grid-template-columns: 1fr 1fr; }
      .cols { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- BEARING:ICONS -->
  <header class="top">
    <div>
      <h1>Decision Recovery</h1>
      <p class="sub" id="subtitle">Archaeology in progress.</p>
    </div>
    <div class="live">
      <span class="dot" id="live-dot"></span>
      <svg class="icon icon-spin" id="live-spin" width="14" height="14" aria-hidden="true"><use href="#icon-spinner"/></svg>
      <span id="live-label">Auto-updates every 5s</span>
    </div>
  </header>
  <div class="constraint" id="constraint"></div>
  <section class="metrics" id="metrics"></section>
  <section class="pipeline">
    <h2>Recovery Pipeline</h2>
    <div class="steps" id="steps"></div>
  </section>
  <section class="cols">
    <div class="panel">
      <h2>Where We’re Looking</h2>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i class="sw scanned"></i> Scanned</span>
        <span><i class="sw scanning"></i> Scanning</span>
        <span><i class="sw"></i> Pending</span>
        <span><i class="sw skipped"></i> Skipped</span>
      </div>
    </div>
    <div class="panel">
      <h2>Activity Feed <span style="float:right;color:#6e6e6e;font-weight:400;font-size:12px" id="last-update"></span></h2>
      <ul class="feed" id="feed"></ul>
    </div>
  </section>
  <div class="focus">
    <div>
      <div style="display:flex;gap:8px;align-items:center;color:#9a9a9a;font-size:12px">
        <svg class="icon"><use href="#icon-search"/></svg> Current Focus
      </div>
      <div class="path" id="focus-path">—</div>
      <div class="meta" id="focus-meta"></div>
    </div>
    <div class="strategy">
      <svg class="icon-lg"><use href="#icon-scales"/></svg>
      <span id="strategy">Strategy: Balanced</span>
    </div>
  </div>
  <p class="done-banner" id="done">Recovery complete. Waiting for Decision Review to open…</p>
  <script type="application/json" id="boot">{}</script>
  <script>
    var parentWin = window.parent;
    var nextId = 1;
    var pending = {};
    var timer = null;
    var STATUS_URI = "bearing://runs/recovery/current";

    function post(msg) { parentWin.postMessage(msg, "*"); }
    function tellSize() {
      var h = Math.max(document.documentElement.scrollHeight || 0, document.body.scrollHeight || 0, 420);
      post({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { height: h } });
    }
    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function rpc(method, params) {
      return new Promise(function (resolve, reject) {
        var id = nextId++;
        var wait = setTimeout(function () {
          if (!pending[id]) return;
          delete pending[id];
          reject({ message: "Host did not answer " + method });
        }, 12000);
        pending[id] = function (result, error) {
          clearTimeout(wait);
          if (error) reject(error);
          else resolve(result || {});
        };
        post({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
      });
    }
    function icon(id) {
      return '<svg class="icon"><use href="#' + id + '"/></svg>';
    }
    function pct(a, b) {
      if (!b) return 0;
      return Math.max(0, Math.min(100, Math.round((a / b) * 100)));
    }
    function render(raw) {
      var data = raw || {};
      if (data.contents && data.contents[0] && data.contents[0].text) {
        try { data = JSON.parse(data.contents[0].text); } catch (e) { data = {}; }
      }
      if (data.structuredContent) data = data.structuredContent;
      var stageIndex = data.stage_index || 1;
      var stageCount = data.stage_count || 6;
      var scope = data.scope || {};
      var findings = data.findings || {};
      var eta = data.eta || {};
      var budget = data.budget || {};
      var current = data.current || {};
      var stages = data.stages || [];
      document.getElementById("subtitle").textContent =
        data.status === "completed" ? "Archaeology complete." :
        data.status === "failed" ? (data.message || "Recovery failed.") :
        "Archaeology in progress.";
      document.getElementById("live-label").textContent =
        data.status === "running" ? "Auto-updates every 5s" : (data.status || "idle");
      document.getElementById("live-spin").style.display = data.status === "running" ? "" : "none";
      var scanned = scope.locations_scanned || 0;
      var total = scope.locations_total || 0;
      document.getElementById("metrics").innerHTML =
        card("Stage", (stageIndex + " / " + stageCount), data.stage_label || "", null) +
        card("Locations", scanned + " / " + (total || "—"), pct(scanned, total) + "%", pct(scanned, total)) +
        card("Decisions", String(findings.candidate_decisions || 0), "Found", null) +
        card("Records", String(findings.records_written || 0), "Written", null) +
        card("Est. Time", eta.display || "—", (budget.status === "constraining" ? "Constraining" : (eta.confidence ? eta.confidence + " confidence" : "Normal")), null, budget.status === "constraining");
      var html = "";
      for (var i = 0; i < (stages.length || 6); i++) {
        var label = (stages[i] && stages[i].label) || ("Step " + (i + 1));
        var cls = i + 1 < stageIndex ? "done" : (i + 1 === stageIndex ? "on" : "");
        html += '<div class="step ' + cls + '"><div class="n">' + (i + 1) + "</div>" + esc(label) + "</div>";
      }
      document.getElementById("steps").innerHTML = html;
      var cells = scope.locations || [];
      var grid = "";
      var n = Math.max(cells.length, 24);
      for (var g = 0; g < Math.min(n, 32); g++) {
        var loc = cells[g] || {};
        var st = loc.state || (g < scanned ? "scanned" : (g === scanned ? "scanning" : "pending"));
        grid += '<div class="cell ' + esc(st) + '" title="' + esc(loc.path || "") + '">' + icon("icon-folder") + "</div>";
      }
      document.getElementById("grid").innerHTML = grid;
      var feed = data.recent_activity || [];
      document.getElementById("feed").innerHTML = feed.slice().reverse().map(function (row) {
        var kind = row.type || "info";
        var badge = kind === "found" ? "found" : kind === "indexed" || kind === "idx" ? "idx" : kind === "scanning" ? "scan" : "info";
        var at = String(row.at || "").slice(11, 19);
        return "<li><span class=\"time\">" + esc(at) + "</span><span class=\"badge " + badge + "\">" + esc(kind) + "</span><span>" + esc(row.label || "") + "</span></li>";
      }).join("") || "<li class=\"error\">Waiting for activity…</li>";
      document.getElementById("focus-path").textContent = current.path || "—";
      var bits = [];
      if (current.kind) bits.push("Type: " + current.kind);
      if (current.items) bits.push("Items: " + current.items);
      if (current.depth) bits.push("Depth: " + current.depth);
      document.getElementById("focus-meta").textContent = bits.join(" • ");
      var mode = (budget.mode || "balanced");
      document.getElementById("strategy").textContent = "Strategy: " + mode.charAt(0).toUpperCase() + mode.slice(1);
      var constraint = document.getElementById("constraint");
      if (budget.status === "constraining" && budget.constraint) {
        var c = budget.constraint;
        constraint.className = "constraint show";
        constraint.innerHTML = icon("icon-alert") + "<div><strong>Scope being constrained.</strong> " + esc(c.reason || "") +
          (c.before != null ? " (" + esc(c.before) + " → " + esc(c.after) + ")." : "") + "</div>";
      } else {
        constraint.className = "constraint";
        constraint.textContent = "";
      }
      document.getElementById("done").style.display = data.status === "completed" ? "block" : "none";
      document.getElementById("last-update").textContent = data.updated_at ? ("Last update: " + String(data.updated_at).slice(11, 19)) : "";
      tellSize();
      return data;
    }
    function card(k, v, h, bar, warn) {
      return '<article class="metric"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) +
        '</div><div class="h ' + (warn ? "warn" : (h === "Normal" || String(h).indexOf("confidence") >= 0 ? "ok" : "")) + '">' +
        esc(h) + "</div>" + (bar != null ? '<div class="bar"><i style="width:' + bar + '%"></i></div>' : "") + "</article>";
    }
    function poll() {
      rpc("resources/read", { uri: STATUS_URI }).then(function (result) {
        var data = render(result);
        if (data && data.status && data.status !== "running") {
          if (timer) clearInterval(timer);
          timer = null;
        }
      }).catch(function () {});
    }
    window.addEventListener("message", function (event) {
      var data = event.data;
      if (!data || data.jsonrpc !== "2.0") return;
      if (data.id != null && pending[data.id]) {
        var cb = pending[data.id];
        delete pending[data.id];
        cb(data.result || {}, data.error || null);
        return;
      }
      if (data.method === "ui/notifications/tool-result") render(data.params || {});
    });
    try {
      var boot = JSON.parse(document.getElementById("boot").textContent || "{}");
      if (boot.run_id || boot.stage) render(boot);
    } catch (e) {}
    post({ jsonrpc: "2.0", method: "ui/notifications/initialized" });
    tellSize();
    timer = setInterval(poll, 5000);
    document.addEventListener("visibilitychange", function () {
      if (timer) clearInterval(timer);
      timer = document.hidden ? setInterval(poll, 15000) : setInterval(poll, 5000);
    });
  </script>
</body>
</html>
